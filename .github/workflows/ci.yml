name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per ref at a time: a docs-only burst cancels the superseded run
# instead of queueing container starts behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the workflow builds and tests, it publishes nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # vir-gtk links gtk4-sys, which needs the system GTK libraries present;
    # Fedora carries a new-enough GTK and matches the suite's actual runtime
    # (the consumer apps target GTK 4.16+). fedora:latest floats on
    # purpose: GTK freshness is the reason this container exists (the
    # v4_14 pin), and a future bump that breaks CI is fixed by re-pinning
    # then, not by tracking a stale release now.
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            pkgconf-pkg-config \
            gtk4-devel \
            xorg-x11-server-Xvfb

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # The suite is mostly pure-function, but the 1.4.0 widget kit and
        # scope/install_default tests construct real widgets (#gtk::test),
        # so a display must exist; xvfb keeps that true on a headless
        # runner. (Xvfb was dropped in 1.0.3 when the suite was display-
        # free; the widget-kit slice brings it back.) Matches the Viaduct
        # convention.
        run: xvfb-run -a cargo test --workspace
