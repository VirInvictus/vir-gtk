name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # vir-gtk links gtk4-sys, which needs the system GTK libraries present;
    # Fedora carries a new-enough GTK and matches the suite's actual runtime
    # (the consumer apps target GTK 4.16+).
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            xorg-x11-server-Xvfb

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # The suite is mostly pure-function, but the 1.4.0 widget kit and
        # scope/install_default tests construct real widgets (#gtk::test),
        # so a display must exist; xvfb keeps that true on a headless
        # runner. (Xvfb was dropped in 1.0.3 when the suite was display-
        # free; the widget-kit slice brings it back.) Matches the Viaduct
        # convention.
        run: xvfb-run -a cargo test --workspace
