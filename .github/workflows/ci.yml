name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # vir-gtk links gtk4-sys, which needs the system GTK libraries present;
    # Fedora carries a new-enough GTK and matches the suite's actual runtime
    # (the consumer apps target GTK 4.16+).
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            sqlite-devel \
            xorg-x11-server-Xvfb

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # The tests are pure-function (no gtk::init), but the gtk4 sys crates
        # must link against the system libraries installed above.
        run: cargo test --workspace
